<svg xmlns="http://www.w3.org/2000/svg" width="1684" height="1191" viewBox="0 0 1684 1191" role="img" aria-labelledby="title desc">
<title id="title">OptiCapture current schema quick ERD</title>
<desc id="desc">One-page quick reference for the nine current tables and seven enforced foreign keys.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c54038"/></marker></defs>
<style><![CDATA[
text { font-family: Segoe UI, Arial, sans-serif; }
.title { font-size: 32px; font-weight: 700; fill: #212121; }
.sub { font-size: 14px; fill: #5f6b6c; }
.domain { font-size: 20px; font-weight: 700; fill: #245f64; }
.name { font-size: 19px; font-weight: 700; fill: #ffffff; }
.name-small { font-size: 14px; font-weight: 700; fill: #333333; }
.body { font-size: 13px; fill: #333333; }
.small { font-size: 11.5px; fill: #5d6667; }
.tiny { font-size: 10.5px; fill: #5d6667; }
.section { font-size: 12px; font-weight: 700; fill: #245f64; }
.key { font-size: 11px; font-weight: 700; fill: #287f87; }
.note-red { font-size: 20px; font-weight: 700; fill: #a63d37; }
.white-small { font-size: 12px; fill: #e8f7f8; }
]]></style>
<rect x="0" y="0" width="1684" height="1191" rx="0" fill="#f8fbfb" stroke="none" />
<text x="58" y="62" class="title" >OptiCapture · current database</text>
<text x="58" y="91" class="sub" >Quick ERD · 9 existing tables · 7 enforced foreign keys · one-page landscape</text>
<text x="1622" y="65" class="sub" text-anchor="end">RED ARROWS = enforced database FKs</text>
<rect x="58" y="112" width="1568" height="1" rx="0" fill="#d9e8e9" stroke="none" />
<g id="table-stores">
<rect x="58" y="177" width="460" height="198" rx="12" fill="#ffffff" stroke="#b7e9ed" />
<rect x="58" y="177" width="460" height="43" rx="10" fill="#287f87" stroke="none" />
<text x="74" y="205" class="name" >stores</text>
<text x="74" y="242" class="small" >Tenant / owning inventory entity</text>
<text x="76" y="268" class="body" >id PK</text>
<text x="76" y="291" class="body" >store_code UNIQUE</text>
<text x="76" y="314" class="body" >name, status</text>
</g>
<g id="table-users">
<rect x="612" y="177" width="460" height="198" rx="12" fill="#ffffff" stroke="#b7e9ed" />
<rect x="612" y="177" width="460" height="43" rx="10" fill="#287f87" stroke="none" />
<text x="628" y="205" class="name" >users</text>
<text x="628" y="242" class="small" >Local / OAuth account</text>
<text x="630" y="268" class="body" >id PK</text>
<text x="630" y="291" class="body" >store_id FK → stores</text>
<text x="630" y="314" class="body" >username + store_id UNIQUE</text>
</g>
<g id="table-user_stores">
<rect x="1166" y="177" width="460" height="198" rx="12" fill="#ffffff" stroke="#b7e9ed" />
<rect x="1166" y="177" width="460" height="43" rx="10" fill="#287f87" stroke="none" />
<text x="1182" y="205" class="name" >user_stores</text>
<text x="1182" y="242" class="small" >Per-store access and role</text>
<text x="1184" y="268" class="body" >user_id PK/FK → users</text>
<text x="1184" y="291" class="body" >store_id PK/FK → stores</text>
<text x="1184" y="314" class="body" >role</text>
</g>
<g id="table-categories">
<rect x="58" y="447" width="460" height="198" rx="12" fill="#ffffff" stroke="#b7e9ed" />
<rect x="58" y="447" width="460" height="43" rx="10" fill="#287f87" stroke="none" />
<text x="74" y="475" class="name" >categories</text>
<text x="74" y="512" class="small" >Store catalog grouping</text>
<text x="76" y="538" class="body" >id PK</text>
<text x="76" y="561" class="body" >store_id FK → stores</text>
<text x="76" y="584" class="body" >name + store_id UNIQUE</text>
</g>
<g id="table-inventory">
<rect x="612" y="447" width="460" height="198" rx="12" fill="#ffffff" stroke="#b7e9ed" />
<rect x="612" y="447" width="460" height="43" rx="10" fill="#287f87" stroke="none" />
<text x="628" y="475" class="name" >inventory</text>
<text x="628" y="512" class="small" >Local catalog and quantity</text>
<text x="630" y="538" class="body" >id PK</text>
<text x="630" y="561" class="body" >store_id FK → stores</text>
<text x="630" y="584" class="body" >category_id FK → categories</text>
<text x="630" y="607" class="body" >external_item_id mapping</text>
</g>
<g id="table-logs">
<rect x="1166" y="447" width="460" height="198" rx="12" fill="#ffffff" stroke="#b7e9ed" />
<rect x="1166" y="447" width="460" height="43" rx="10" fill="#287f87" stroke="none" />
<text x="1182" y="475" class="name" >logs</text>
<text x="1182" y="512" class="small" >90-day audit log</text>
<text x="1184" y="538" class="body" >id PK</text>
<text x="1184" y="561" class="body" >store_id, user_id (no FK)</text>
<text x="1184" y="584" class="body" >timestamp</text>
</g>
<g id="table-scan_sessions">
<rect x="58" y="717" width="460" height="198" rx="12" fill="#ffffff" stroke="#b7e9ed" />
<rect x="58" y="717" width="460" height="43" rx="10" fill="#287f87" stroke="none" />
<text x="74" y="745" class="name" >scan_sessions</text>
<text x="74" y="782" class="small" >Desktop/mobile scan lifecycle</text>
<text x="76" y="808" class="body" >session_id PK</text>
<text x="76" y="831" class="body" >store_id, user_id (no FK)</text>
<text x="76" y="854" class="body" >otp, status, expires_at</text>
</g>
<g id="table-session_items">
<rect x="612" y="717" width="460" height="198" rx="12" fill="#ffffff" stroke="#b7e9ed" />
<rect x="612" y="717" width="460" height="43" rx="10" fill="#287f87" stroke="none" />
<text x="628" y="745" class="name" >session_items</text>
<text x="628" y="782" class="small" >Mutable staged scans</text>
<text x="630" y="808" class="body" >id PK</text>
<text x="630" y="831" class="body" >session_id FK → scan_sessions</text>
<text x="630" y="854" class="body" >upc, quantity, device_id</text>
</g>
<g id="table-schema_migrations">
<rect x="1166" y="717" width="460" height="198" rx="12" fill="#ffffff" stroke="#b7e9ed" />
<rect x="1166" y="717" width="460" height="43" rx="10" fill="#287f87" stroke="none" />
<text x="1182" y="745" class="name" >schema_migrations</text>
<text x="1182" y="782" class="small" >Applied schema versions</text>
<text x="1184" y="808" class="body" >version PK</text>
<text x="1184" y="831" class="body" >applied_at</text>
</g>
<path d="M 518 250 H 612" fill="none" stroke="#c54038" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1072 250 H 1166" fill="none" stroke="#c54038" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 288 177 V 146 H 1396 V 177" fill="none" stroke="#c54038" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 288 375 V 447" fill="none" stroke="#c54038" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 518 350 H 585 V 440 H 842 V 447" fill="none" stroke="#c54038" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 518 543 H 612" fill="none" stroke="#c54038" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 518 813 H 612" fill="none" stroke="#c54038" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="58" y="975" width="1568" height="140" rx="10" fill="#fff5f4" stroke="#edc9c6" />
<text x="78" y="1003" class="note-red" >Important rules</text>
<text x="78" y="1031" class="body" >Only solid connectors are SQLite foreign keys. logs and scan_sessions contain store/user IDs without FK constraints.</text>
<text x="78" y="1057" class="body" >Inventory is store-scoped; category/store consistency and active-store access are enforced in application routes.</text>
<text x="78" y="1083" class="body" >This is the current schema. Count-result snapshots, SSO handoff history, export history, and reconciliation are planned separately.</text>
</svg>
